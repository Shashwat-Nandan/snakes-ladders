<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snakes & Ladders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- LOBBY -->
  <section id="lobby" class="lobby">
    <div class="lobby-inner">
      <div class="lobby-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 64 64" width="64" height="64" fill="none">
            <rect x="4" y="4" width="56" height="56" rx="12" fill="#4f46e5" />
            <text x="32" y="42" text-anchor="middle" font-size="28" font-weight="900" fill="white" font-family="Nunito, sans-serif">S&amp;L</text>
          </svg>
        </div>
        <h1>Snakes &amp; Ladders</h1>
        <p class="lobby-sub">Multiplayer board game for up to 3 players.<br/>Create a room, share the code, roll from anywhere.</p>
      </div>

      <form id="auth-form" class="lobby-card" autocomplete="off">
        <div class="field">
          <label for="player-name">Your name</label>
          <input id="player-name" name="name" type="text" maxlength="20" placeholder="e.g. Alice" required />
        </div>

        <button type="submit" class="btn btn-create">Create New Room</button>

        <div class="separator"><span>or join with a code</span></div>

        <div class="field">
          <label for="room-id">Room code</label>
          <input id="room-id" name="roomId" type="text" maxlength="6" placeholder="e.g. A1B2C3" />
        </div>
        <button type="button" id="join-submit" class="btn btn-join">Join Room</button>

        <p id="auth-error" class="error-msg" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="game hidden">
    <header class="topbar">
      <span class="topbar-title">Snakes &amp; Ladders</span>
      <div class="topbar-room">
        <span class="topbar-room-label">Room</span>
        <span id="room-label" class="topbar-room-code">------</span>
      </div>
      <div class="topbar-share">
        <input id="share-link" class="share-input" readonly />
        <button id="copy-link" class="btn btn-copy">Copy</button>
      </div>
    </header>

    <div class="game-body">
      <div class="board-area">
        <div id="board" class="board"></div>
      </div>

      <aside class="panel">
        <!-- Players -->
        <div class="panel-section">
          <h3 class="panel-heading">Players</h3>
          <ul id="player-list" class="player-list"></ul>
        </div>

        <!-- Dice -->
        <div class="panel-section dice-section">
          <h3 class="panel-heading" id="turn-label">Waiting for players...</h3>
          <div class="dice-row">
            <div id="dice-visual" class="dice-visual">?</div>
            <button id="roll-button" class="btn btn-roll" disabled>Roll Dice</button>
          </div>
          <p id="roll-result" class="roll-status"></p>
        </div>

        <!-- Winner -->
        <div id="winner-banner" class="panel-section winner-section hidden">
          <div class="winner-icon">&#127942;</div>
          <h3 class="winner-text"><span id="winner-name"></span> wins!</h3>
          <button id="play-again" class="btn btn-create">Play Again</button>
        </div>

        <!-- Log -->
        <div class="panel-section log-section">
          <h3 class="panel-heading">Game Log</h3>
          <ul id="game-log" class="game-log"></ul>
        </div>
      </aside>
    </div>
  </section>

  <script src="/app.js" defer></script>
</body>
</html>
