<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snakes & Ladders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- LOBBY -->
  <section id="lobby" class="lobby">
    <div class="lobby-bg">
      <div class="grain"></div>
      <div class="lobby-glow g1"></div>
      <div class="lobby-glow g2"></div>
    </div>

    <div class="lobby-content">
      <div class="lobby-header">
        <div class="decorative-line"></div>
        <p class="kicker">A Classic Reimagined</p>
        <h1 class="lobby-title">Snakes<br/><span>&</span><br/>Ladders</h1>
        <p class="lobby-sub">Up to 3 players. Share a link. Roll from anywhere.</p>
        <div class="decorative-line"></div>
      </div>

      <form id="auth-form" class="lobby-form" autocomplete="off">
        <div class="input-group">
          <label for="player-name">Your Name</label>
          <input id="player-name" name="name" type="text" maxlength="20" placeholder="Enter your name" required />
        </div>

        <button type="submit" class="btn btn-primary" id="create-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create Room
        </button>

        <div class="divider"><span>or join an existing room</span></div>

        <div id="join-fields" class="join-fields">
          <div class="input-group">
            <label for="room-id">Room Code</label>
            <input id="room-id" name="roomId" type="text" maxlength="6" placeholder="ABC123" style="text-transform:uppercase; letter-spacing:0.2em" />
          </div>
          <button type="button" id="join-submit" class="btn btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Join Room
          </button>
        </div>

        <p id="auth-error" class="form-error" aria-live="polite"></p>
      </form>

      <div class="lobby-snakes">
        <svg viewBox="0 0 200 60" class="snake-deco">
          <path d="M10,30 Q30,10 50,30 T90,30 T130,30 T170,30 T200,20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
        </svg>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="game hidden">

    <!-- Top bar -->
    <header class="game-header">
      <div class="game-header-left">
        <h2 class="game-title">Snakes & Ladders</h2>
      </div>
      <div class="game-header-center">
        <div class="room-badge">
          <span class="room-badge-label">Room</span>
          <span id="room-label" class="room-badge-code">------</span>
        </div>
      </div>
      <div class="game-header-right">
        <input id="share-link" class="share-input" readonly />
        <button id="copy-link" class="btn btn-small">Copy Link</button>
      </div>
    </header>

    <div class="game-layout">

      <!-- Board -->
      <div class="board-wrapper">
        <div class="board-frame">
          <canvas id="board-canvas" class="board-canvas"></canvas>
          <div id="board" class="board"></div>
        </div>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar">

        <!-- Players -->
        <div class="card">
          <h3 class="card-title">Players</h3>
          <ul id="player-list" class="player-list"></ul>
        </div>

        <!-- Dice / Controls -->
        <div class="card dice-card">
          <h3 class="card-title" id="turn-label">Waiting...</h3>
          <div class="dice-zone">
            <div id="dice-container" class="dice-container">
              <div id="dice" class="dice">
                <div class="dice-face face-1"><span class="dot"></span></div>
                <div class="dice-face face-2"><span class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-3"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-4"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-5"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-6"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              </div>
            </div>
            <button id="roll-button" class="btn btn-roll" disabled>
              Roll Dice
            </button>
          </div>
          <p id="roll-result" class="roll-status">Waiting for game to start</p>
        </div>

        <!-- Winner -->
        <div id="winner-banner" class="card winner-card hidden">
          <div class="winner-trophy">&#127942;</div>
          <h3 class="winner-text"><span id="winner-name"></span> wins!</h3>
          <button id="play-again" class="btn btn-primary">New Game</button>
        </div>

        <!-- Log -->
        <div class="card log-card">
          <h3 class="card-title">Game Log</h3>
          <ul id="game-log" class="game-log"></ul>
        </div>

      </aside>
    </div>
  </section>

  <script src="/app.js" defer></script>
</body>
</html>
